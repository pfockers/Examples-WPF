<li [class]="'ticket ' + ticket.status">
  <div class="ticket-main">
    <span [class]="'priority ' + ticket.priority">{{ priorityLabel[ticket.priority] }}</span>
    <a class="title" [routerLink]="['/tickets', ticket.id]">{{ ticket.title }}</a>
    <small>{{ ticket.createdAt | date: 'dd.MM.yyyy' }}</small>
  </div>
  <div class="ticket-actions">
    <select aria-label="Status" [ngModel]="ticket.status" (ngModelChange)="statusChange.emit($event)">
      @for (s of statuses; track s) {
        <option [value]="s">{{ statusLabel[s] }}</option>
      }
    </select>
    <button class="danger" (click)="delete.emit()" aria-label="Loeschen">&times;</button>
  </div>
</li>
