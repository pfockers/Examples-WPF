<div class="app">
  <header>
    <h1><a routerLink="/">Ticket Tracker</a></h1>
    <div class="header-right">
      @if (auth.username()) {
        <span class="user">{{ auth.username() }}</span>
        <button (click)="auth.logout()">Abmelden</button>
      }
      <span class="badge-tech angular">Angular</span>
    </div>
  </header>

  <router-outlet />
</div>
