name: ticket-tracker

services:
  api:
    build: ./Compare_TicketApi
    ports:
      - "5300:5300"
    environment:
      # Nur fuer die Demo; in echten Umgebungen eigenen Schluessel per JWT_KEY setzen.
      Jwt__Key: ${JWT_KEY:-docker-demo-key-change-me-at-least-32-chars}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:4200
      Cors__AllowedOrigins__2: http://localhost:5200
    volumes:
      - ticket-data:/data

  react:
    build:
      context: ./Compare_React_TicketTracker
      args:
        VITE_API_URL: http://localhost:5300
    ports:
      - "5173:80"
    depends_on:
      - api

  angular:
    build: ./Compare_Angular_TicketTracker
    ports:
      - "4200:80"
    depends_on:
      - api

  blazor:
    build: ./Compare_Blazor_TicketTracker
    ports:
      - "5200:80"
    depends_on:
      - api

volumes:
  ticket-data:
